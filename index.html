<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="./manifest.json">
    <title>Split & Snap - Receipt & Expense Splitter</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="Quick Receipt & Expense Splitter & Tip Calculator">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Split&Snap">

    <!-- Inline Web App Manifest Data URI -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Glassmorphism Styling */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* Smooth Pulse Animation for Disabled Action Visual Cue */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.5; }
        }
        .pulse-warning {
            animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full font-sans transition-colors duration-200">

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 ease-out bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-2xl flex items-center space-x-3 pointer-events-none">
        <i id="toast-icon" class="fas fa-check-circle text-emerald-400 dark:text-emerald-600"></i>
        <span id="toast-message" class="text-sm font-medium">Notification message</span>
    </div>

    <!-- Main Container -->
    <div class="max-w-2xl mx-auto px-4 py-6 sm:px-6">

        <!-- Top Header & Controls -->
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                    <i class="fas fa-receipt text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Split & Snap</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400" data-i18n="tagline">Smart Expense Splitter</p>
                </div>
            </div>

            <!-- Controls: Theme & Language -->
            <div class="flex items-center space-x-2">
                <!-- Theme Toggle -->
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 shadow-sm border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block text-amber-400"></i>
                </button>

                <!-- Language Selector -->
                <div class="relative">
                    <select id="lang-select" class="appearance-none bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold pl-3 pr-8 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
                        <option value="en">🇺🇸 EN</option>
                        <option value="el">🇬🇷 EL</option>
                        <option value="de">🇩🇪 DE</option>
                        <option value="fr">🇫🇷 FR</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
                </div>
            </div>
        </header>

        <!-- Main Card -->
        <main class="glass rounded-3xl p-5 sm:p-7 shadow-xl mb-6">
            
            <!-- Mode Switcher Tabs -->
            <div class="grid grid-cols-2 gap-1.5 p-1.5 bg-slate-200/60 dark:bg-slate-800/80 rounded-2xl mb-6">
                <button id="tab-equal" onclick="switchMode('equal')" class="py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition duration-200 bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm flex items-center justify-center space-x-2">
                    <i class="fas fa-users text-sm"></i>
                    <span data-i18n="tabEqual">Equal Split</span>
                </button>
                <button id="tab-itemized" onclick="switchMode('itemized')" class="py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center space-x-2">
                    <i class="fas fa-list-check text-sm"></i>
                    <span data-i18n="tabItemized">Itemized Split</span>
                </button>
            </div>

            <!-- MODE 1: EQUAL SPLIT ENGINE -->
            <div id="engine-equal" class="space-y-5">
                <!-- Bill Amount Input -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2" data-i18n="billTotal">Bill Total</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg font-bold">€</span>
                        <input type="number" id="eq-bill" step="0.01" min="0" placeholder="0.00" oninput="calculateEqual()" class="w-full bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/80 rounded-2xl py-3.5 pl-10 pr-4 text-xl font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
                    </div>
                </div>

                <!-- Tip Selector -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2" data-i18n="tipSelection">Tip Percentage</label>
                    <div class="grid grid-cols-5 gap-2">
                        <button onclick="setTip(0)" class="tip-btn py-2.5 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand-500 transition">0%</button>
                        <button onclick="setTip(5)" class="tip-btn py-2.5 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand-500 transition">5%</button>
                        <button onclick="setTip(10)" class="tip-btn py-2.5 text-xs font-bold rounded-xl border border-brand-500 bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 transition">10%</button>
                        <button onclick="setTip(15)" class="tip-btn py-2.5 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand-500 transition">15%</button>
                        <input type="number" id="eq-custom-tip" min="0" max="100" placeholder="Custom" oninput="setCustomTip()" class="w-full text-center text-xs font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>

                <!-- People Counter -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2" data-i18n="numberOfPeople">Number of People</label>
                    <div class="flex items-center justify-between bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/80 rounded-2xl p-2">
                        <button onclick="changePeople(-1)" class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center font-bold text-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition active:scale-95">
                            <i class="fas fa-minus"></i>
                        </button>
                        <span id="eq-people-count" class="text-xl font-bold">2</span>
                        <button onclick="changePeople(1)" class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center font-bold text-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition active:scale-95">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- MODE 2: ITEMIZED SPLIT ENGINE -->
            <div id="engine-itemized" class="space-y-5 hidden">
                <!-- Add New Item Form -->
                <div class="bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/50 space-y-3">
                    <div class="grid grid-cols-12 gap-2">
                        <input type="text" id="itm-name" placeholder="Item Name (e.g. Pizza)" class="col-span-7 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" data-i18n-placeholder="itemPlaceholder">
                        <input type="number" id="itm-price" step="0.01" min="0" placeholder="Price (€)" class="col-span-5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" data-i18n-placeholder="pricePlaceholder">
                    </div>
                    <div class="grid grid-cols-12 gap-2">
                        <input type="text" id="itm-assigned" placeholder="Assigned to (e.g. Alex, Maria)" class="col-span-9 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" data-i18n-placeholder="assignedPlaceholder">
                        <button onclick="addItem()" class="col-span-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs rounded-xl flex items-center justify-center space-x-1 transition active:scale-95">
                            <i class="fas fa-plus"></i>
                            <span data-i18n="addBtn">Add</span>
                        </button>
                    </div>
                </div>

                <!-- Tip Percentage for Itemized -->
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" data-i18n="tipSelection">Tip Percentage</span>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="itm-tip-pct" value="10" min="0" max="100" oninput="calculateItemized()" class="w-16 text-center text-sm font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-1 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        <span class="text-sm font-bold">%</span>
                    </div>
                </div>

                <!-- Items List -->
                <div class="space-y-2 max-h-52 overflow-y-auto pr-1" id="items-list-container">
                    <!-- Dynamic Items render here -->
                </div>
            </div>

            <!-- SUMMARY BREAKDOWN BOX -->
            <div class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-700/80">
                <div class="bg-gradient-to-br from-brand-500 to-indigo-700 rounded-2xl p-5 text-white shadow-lg space-y-3">
                    <div class="flex justify-between items-center text-xs opacity-90 font-medium">
                        <span data-i18n="subtotal">Subtotal</span>
                        <span id="sum-subtotal">€0.00</span>
                    </div>
                    <div class="flex justify-between items-center text-xs opacity-90 font-medium">
                        <span data-i18n="tipAmount">Tip Amount</span>
                        <span id="sum-tip">€0.00</span>
                    </div>
                    <div class="flex justify-between items-center border-t border-white/20 pt-2 text-base font-bold">
                        <span data-i18n="grandTotal">Grand Total</span>
                        <span id="sum-grand" class="text-xl">€0.00</span>
                    </div>
                    <div class="bg-white/10 rounded-xl p-3 flex justify-between items-center mt-2">
                        <span class="text-xs font-medium uppercase tracking-wider opacity-80" data-i18n="perPerson">Per Person</span>
                        <span id="sum-per-person" class="text-2xl font-black">€0.00</span>
                    </div>
                </div>

                <!-- Breakdown Per Person Container (for itemized or equal details) -->
                <div id="breakdown-details" class="mt-3 space-y-1 text-xs"></div>
            </div>

            <!-- PAYMENT DETAILS EXPANDABLE SECTION -->
            <div class="mt-4 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-3.5 bg-slate-50/50 dark:bg-slate-800/30">
                <button onclick="togglePaymentDetails()" class="w-full flex justify-between items-center text-xs font-semibold text-slate-600 dark:text-slate-300">
                    <span class="flex items-center space-x-2">
                        <i class="fas fa-wallet text-brand-500"></i>
                        <span data-i18n="paymentDetails">Payment Details (Optional)</span>
                    </span>
                    <i id="payment-chevron" class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
                </button>
                <div id="payment-fields" class="hidden mt-3 space-y-2">
                    <input type="text" id="pay-iban" placeholder="IBAN (e.g. GR123456...)" oninput="savePaymentPrefs()" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="pay-revolut" placeholder="Revolut Tag (@tag)" oninput="savePaymentPrefs()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        <input type="text" id="pay-paypal" placeholder="PayPal.me link" oninput="savePaymentPrefs()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- MANDATORY PRIVACY & CONSENT CHECKBOX SECTION -->
            <div class="mt-5 p-3.5 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-start space-x-3">
                <input type="checkbox" id="privacy-check" onchange="handlePrivacyToggle()" class="mt-0.5 w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500 cursor-pointer">
                <label for="privacy-check" id="privacy-text" class="text-xs text-slate-600 dark:text-slate-300 cursor-pointer select-none leading-relaxed">
                    <!-- Dynamic localized text injected here -->
                </label>
            </div>

            <!-- ACTION WARNING PROMPT (VISIBLE WHEN CHECKBOX IS UNCHECKED) -->
            <div id="privacy-warning" class="mt-2 text-center text-amber-600 dark:text-amber-400 text-xs font-semibold pulse-warning flex items-center justify-center space-x-1.5">
                <i class="fas fa-exclamation-triangle"></i>
                <span data-i18n="confirmationRequired">Please check the confirmation box above to proceed.</span>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="grid grid-cols-3 gap-2.5 mt-4">
                <button id="btn-share" onclick="actionShare()" disabled class="py-3 px-2 bg-brand-600 text-white rounded-2xl font-bold text-xs flex flex-col items-center justify-center space-y-1 transition opacity-40 cursor-not-allowed shadow-md">
                    <i class="fas fa-share-nodes text-sm"></i>
                    <span data-i18n="btnShare">Share</span>
                </button>
                <button id="btn-copy" onclick="actionCopy()" disabled class="py-3 px-2 bg-slate-800 dark:bg-slate-700 text-white rounded-2xl font-bold text-xs flex flex-col items-center justify-center space-y-1 transition opacity-40 cursor-not-allowed shadow-md">
                    <i class="fas fa-copy text-sm"></i>
                    <span data-i18n="btnCopy">Copy</span>
                </button>
                <button id="btn-save" onclick="actionSaveHistory()" disabled class="py-3 px-2 bg-emerald-600 text-white rounded-2xl font-bold text-xs flex flex-col items-center justify-center space-y-1 transition opacity-40 cursor-not-allowed shadow-md">
                    <i class="fas fa-bookmark text-sm"></i>
                    <span data-i18n="btnSave">Save Log</span>
                </button>
            </div>

        </main>

        <!-- HISTORY SECTION -->
        <section class="glass rounded-3xl p-5 sm:p-7 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold uppercase tracking-wider flex items-center space-x-2 text-slate-700 dark:text-slate-200">
                    <i class="fas fa-history text-brand-500"></i>
                    <span data-i18n="historyTitle">Recent History</span>
                </h2>
                <button onclick="clearHistory()" class="text-xs font-semibold text-rose-500 hover:text-rose-600 transition flex items-center space-x-1">
                    <i class="fas fa-trash-alt"></i>
                    <span data-i18n="clearHistory">Clear Log</span>
                </button>
            </div>

            <div id="history-list" class="space-y-2.5">
                <!-- History Items Dynamic Injection -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="mt-8 text-center text-xs text-slate-400 dark:text-slate-500 space-y-1">
            <p>Split & Snap &bull; Privacy-first Local Calculation</p>
            <p class="text-[10px] opacity-70">PWABuilder Ready &bull; Offline Capable</p>
        </footer>

    </div>

    <!-- MAIN APPLICATION LOGIC & TRANSLATIONS -->
    <script>
        // 1. TRANSLATION DICTIONARY
        const I18N = {

                addBtn: "Hinzufügen",
                paymentDetails: "Zahlungsdetails (Optional)",
                privacyNotice: "Ich bestätige, dass alle angegebenen Daten meine eigenen sind. Es werden keine Daten an Dritte übermittelt; alle Daten werden ausschließlich lokal gespeichert.",
                confirmationRequired: "Bitte aktivieren Sie das Bestätigungsfeld oben, um fortzufahren.",
                btnShare: "Teilen",
                btnCopy: "Kopieren",
                btnSave: "Speichern",
                historyTitle: "Verlauf",
                clearHistory: "Löschen",
                noHistory: "Noch keine Berechnungen gespeichert.",
                copiedSuccess: "Zusammenfassung in die Zwischenablage kopiert!",
                savedSuccess: "Im Verlauf gespeichert!",
                historyCleared: "Verlauf gelöscht.",
                itemRequired: "Bitte geben Sie einen Namen und einen gültigen Preis ein.",
                shareTitle: "Split & Snap Abrechnung"
            },
            fr: {
                tagline: "Partage Intelligent de Factures",
                tabEqual: "Partage Égal",
                tabItemized: "Par Article",
                billTotal: "Total Facture",
                tipSelection: "Pourcentage Pourboire",
                numberOfPeople: "Nombre de Personnes",
                subtotal: "Sous-total",
                tipAmount: "Pourboire",
                grandTotal: "Total Général",
                perPerson: "Par Personne",
                itemPlaceholder: "Nom de l'article (ex. Pizza)",
                pricePlaceholder: "Prix (€)",
                assignedPlaceholder: "Attribué à (ex. Alexis, Marie)",
                addBtn: "Ajouter",
                paymentDetails: "Détails de Paiement (Optionnel)",
                privacyNotice: "Je confirme que toutes les informations fournies me sont propres. Aucune donnée n'est transmise à des tiers; tout est stocké uniquement en local.",
                confirmationRequired: "Veuillez cocher la case de confirmation ci-dessus pour continuer.",
                btnShare: "Partager",
                btnCopy: "Copier",
                btnSave: "Sauvegarder",
                historyTitle: "Historique Récents",
                clearHistory: "Effacer",
                noHistory: "Aucun calcul enregistré pour le moment.",
                copiedSuccess: "Résumé copié dans le presse-papiers !",
                savedSuccess: "Enregistré dans l'historique !",
                historyCleared: "Historique effacé.",
                itemRequired: "Veuillez saisir un nom et un prix valide.",
                shareTitle: "Décompte Split & Snap"
            }
        };

        // 2. STATE MANAGEMENT
        let currentLang = localStorage.getItem('snapsplit_lang') || 'en';
        let currentMode = 'equal'; // 'equal' or 'itemized'
        let currentTipPct = 10;
        let peopleCount = 2;
        let itemizedItems = [];

        // 3. INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initLanguage();
            loadPaymentPrefs();
            renderHistory();
            calculateEqual();
            registerServiceWorker();
        });

        // 4. THEME CONTROLLER
        function initTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            document.getElementById('theme-toggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });
        }

        // 5. LANGUAGE CONTROLLER
        function initLanguage() {
            const select = document.getElementById('lang-select');
            select.value = currentLang;
            select.addEventListener('change', (e) => {
                currentLang = e.target.value;
                localStorage.setItem('snapsplit_lang', currentLang);
                applyTranslations();
                recalculate();
            });
            applyTranslations();
        }

        function applyTranslations() {
            const dict = I18N[currentLang] || I18N.en;
            
            // Text nodes
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });

            // Placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[key]) el.placeholder = dict[key];
            });

            // Privacy Notice Text Injection
            document.getElementById('privacy-text').textContent = dict.privacyNotice;

            // Update empty history state if present
            const histContainer = document.getElementById('history-list');
            if (histContainer.children.length === 1 && histContainer.children[0].classList.contains('no-hist-msg')) {
                histContainer.children[0].textContent = dict.noHistory;
            }
        }

        // 6. PRIVACY & MANDATORY CHECKBOX CONTROL
        function handlePrivacyToggle() {
            const isChecked = document.getElementById('privacy-check').checked;
            const btnShare = document.getElementById('btn-share');
            const btnCopy = document.getElementById('btn-copy');
            const btnSave = document.getElementById('btn-save');
            const warningPrompt = document.getElementById('privacy-warning');

            if (isChecked) {
                btnShare.disabled = false;
                btnCopy.disabled = false;
                btnSave.disabled = false;

                [btnShare, btnCopy, btnSave].forEach(btn => {
                    btn.classList.remove('opacity-40', 'cursor-not-allowed');
                    btn.classList.add('hover:opacity-90', 'active:scale-95');
                });

                warningPrompt.classList.add('hidden');
            } else {
                btnShare.disabled = true;
                btnCopy.disabled = true;
                btnSave.disabled = true;

                [btnShare, btnCopy, btnSave].forEach(btn => {
                    btn.classList.add('opacity-40', 'cursor-not-allowed');
                    btn.classList.remove('hover:opacity-90', 'active:scale-95');
                });

                warningPrompt.classList.remove('hidden');
            }
        }

        // 7. MODE SWITCHING
        function switchMode(mode) {
            currentMode = mode;
            const tabEqual = document.getElementById('tab-equal');
            const tabItemized = document.getElementById('tab-itemized');
            const engineEqual = document.getElementById('engine-equal');
            const engineItemized = document.getElementById('engine-itemized');

            if (mode === 'equal') {
                tabEqual.className = "py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition duration-200 bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm flex items-center justify-center space-x-2";
                tabItemized.className = "py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center space-x-2";
                engineEqual.classList.remove('hidden');
                engineItemized.classList.add('hidden');
                calculateEqual();
            } else {
                tabItemized.className = "py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition duration-200 bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm flex items-center justify-center space-x-2";
                tabEqual.className = "py-2.5 text-xs sm:text-sm font-semibold rounded-xl transition duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center space-x-2";
                engineItemized.classList.remove('hidden');
                engineEqual.classList.add('hidden');
                calculateItemized();
            }
        }

        // 8. EQUAL SPLIT ENGINE LOGIC
        function setTip(pct) {
            currentTipPct = pct;
            document.getElementById('eq-custom-tip').value = '';
            
            // Highlight Tip Buttons
            document.querySelectorAll('.tip-btn').forEach((btn, idx) => {
                const values = [0, 5, 10, 15];
                if (values[idx] === pct) {
                    btn.className = "tip-btn py-2.5 text-xs font-bold rounded-xl border border-brand-500 bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 transition";
                } else {
                    btn.className = "tip-btn py-2.5 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand-500 transition";
                }
            });
            calculateEqual();
        }

        function setCustomTip() {
            const val = parseFloat(document.getElementById('eq-custom-tip').value);
            currentTipPct = isNaN(val) ? 0 : val;
            document.querySelectorAll('.tip-btn').forEach(btn => {
                btn.className = "tip-btn py-2.5 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-brand-500 transition";
            });
            calculateEqual();
        }

        function changePeople(delta) {
            peopleCount = Math.max(1, peopleCount + delta);
            document.getElementById('eq-people-count').textContent = peopleCount;
            calculateEqual();
        }

        function calculateEqual() {
            const bill = parseFloat(document.getElementById('eq-bill').value) || 0;
            const tipVal = bill * (currentTipPct / 100);
            const total = bill + tipVal;
            const perPerson = total / peopleCount;

            updateSummaryDisplay(bill, tipVal, total, perPerson);
            
            // Clear detailed breakdown in equal mode
            document.getElementById('breakdown-details').innerHTML = '';
        }

        // 9. ITEMIZED SPLIT ENGINE LOGIC
        function addItem() {
            const nameEl = document.getElementById('itm-name');
            const priceEl = document.getElementById('itm-price');
            const assignedEl = document.getElementById('itm-assigned');

            const name = nameEl.value.trim();
            const price = parseFloat(priceEl.value);
            const assigned = assignedEl.value.trim() || 'Everyone';

            if (!name || isNaN(price) || price <= 0) {
                showToast((I18N[currentLang] || I18N.en).itemRequired, true);
                return;
            }

            itemizedItems.push({ id: Date.now(), name, price, assigned });
            nameEl.value = '';
            priceEl.value = '';
            assignedEl.value = '';

            renderItemsList();
            calculateItemized();
        }

        function removeItem(id) {
            itemizedItems = itemizedItems.filter(item => item.id !== id);
            renderItemsList();
            calculateItemized();
        }

        function renderItemsList() {
            const container = document.getElementById('items-list-container');
            container.innerHTML = '';

            itemizedItems.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = "flex justify-between items-center p-2.5 bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 rounded-xl text-xs";
                itemEl.innerHTML = `
                    <div class="truncate pr-2">
                        <span class="font-bold text-slate-800 dark:text-slate-100">${escapeHtml(item.name)}</span>
                        <span class="text-slate-400 dark:text-slate-500 text-[10px] block">${escapeHtml(item.assigned)}</span>
                    </div>
                    <div class="flex items-center space-x-3 shrink-0">
                        <span class="font-bold">€${item.price.toFixed(2)}</span>
                        <button onclick="removeItem(${item.id})" class="text-rose-500 hover:text-rose-600 transition p-1">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
                container.appendChild(itemEl);
            });
        }

        function calculateItemized() {
            const tipPct = parseFloat(document.getElementById('itm-tip-pct').value) || 0;
            const subtotal = itemizedItems.reduce((acc, item) => acc + item.price, 0);
            const tipVal = subtotal * (tipPct / 100);
            const grandTotal = subtotal + tipVal;

            // Calculate per person mapped totals
            const personMap = {};
            itemizedItems.forEach(item => {
                const names = item.assigned.split(',').map(n => n.trim()).filter(n => n.length > 0);
                const sharePrice = item.price / (names.length || 1);
                
                names.forEach(name => {
                    personMap[name] = (personMap[name] || 0) + sharePrice;
                });
            });

            const uniquePeopleCount = Object.keys(personMap).length || 1;
            const avgPerPerson = grandTotal / uniquePeopleCount;

            updateSummaryDisplay(subtotal, tipVal, grandTotal, avgPerPerson);

            // Render Itemized breakdown breakdown HTML
            const breakdownEl = document.getElementById('breakdown-details');
            breakdownEl.innerHTML = '';

            if (Object.keys(personMap).length > 0) {
                const multiplier = 1 + (tipPct / 100);
                Object.entries(personMap).forEach(([person, rawAmount]) => {
                    const finalShare = rawAmount * multiplier;
                    const row = document.createElement('div');
                    row.className = "flex justify-between items-center py-1 border-b border-slate-200/50 dark:border-slate-700/30 text-slate-600 dark:text-slate-300";
                    row.innerHTML = `
                        <span>${escapeHtml(person)}</span>
                        <span class="font-bold">€${finalShare.toFixed(2)}</span>
                    `;
                    breakdownEl.appendChild(row);
                });
            }
        }

        // 10. SUMMARY DISPLAY UPDATER
        function updateSummaryDisplay(subtotal, tip, grandTotal, perPerson) {
            document.getElementById('sum-subtotal').textContent = `€${subtotal.toFixed(2)}`;
            document.getElementById('sum-tip').textContent = `€${tip.toFixed(2)}`;
            document.getElementById('sum-grand').textContent = `€${grandTotal.toFixed(2)}`;
            document.getElementById('sum-per-person').textContent = `€${perPerson.toFixed(2)}`;
        }

        function recalculate() {
            if (currentMode === 'equal') calculateEqual();
            else calculateItemized();
        }

        // 11. PAYMENT DETAILS PERSISTENCE
        function togglePaymentDetails() {
            const fields = document.getElementById('payment-fields');
            const chevron = document.getElementById('payment-chevron');
            fields.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function savePaymentPrefs() {
            const prefs = {
                iban: document.getElementById('pay-iban').value,
                revolut: document.getElementById('pay-revolut').value,
                paypal: document.getElementById('pay-paypal').value,
            };
            localStorage.setItem('snapsplit_payment', JSON.stringify(prefs));
        }

        function loadPaymentPrefs() {
            const raw = localStorage.getItem('snapsplit_payment');
            if (raw) {
                try {
                    const prefs = JSON.parse(raw);
                    document.getElementById('pay-iban').value = prefs.iban || '';
                    document.getElementById('pay-revolut').value = prefs.revolut || '';
                    document.getElementById('pay-paypal').value = prefs.paypal || '';
                } catch(e) {}
            }
        }

        // 12. TEXT SUMMARY GENERATOR FOR SHARING & COPYING
        function generateShareString() {
            const dict = I18N[currentLang] || I18N.en;
            const subtotal = document.getElementById('sum-subtotal').textContent;
            const tip = document.getElementById('sum-tip').textContent;
            const grand = document.getElementById('sum-grand').textContent;
            const perPerson = document.getElementById('sum-per-person').textContent;

            let text = `🧾 *Split & Snap Breakdown*\n`;
            text += `---------------------------\n`;
            text += `${dict.subtotal}: ${subtotal}\n`;
            text += `${dict.tipAmount}: ${tip}\n`;
            text += `${dict.grandTotal}: ${grand}\n`;
            text += `${dict.perPerson}: ${perPerson}\n`;

            if (currentMode === 'itemized' && itemizedItems.length > 0) {
                text += `\n📋 *${dict.tabItemized}:*\n`;
                const tipPct = parseFloat(document.getElementById('itm-tip-pct').value) || 0;
                const multiplier = 1 + (tipPct / 100);
                
                const personMap = {};
                itemizedItems.forEach(item => {
                    const names = item.assigned.split(',').map(n => n.trim()).filter(n => n.length > 0);
                    const sharePrice = item.price / (names.length || 1);
                    names.forEach(name => {
                        personMap[name] = (personMap[name] || 0) + sharePrice;
                    });
                });

                Object.entries(personMap).forEach(([person, rawAmount]) => {
                    text += `• ${person}: €${(rawAmount * multiplier).toFixed(2)}\n`;
                });
            }

            // Append Payment Details if present
            const iban = document.getElementById('pay-iban').value.trim();
            const revolut = document.getElementById('pay-revolut').value.trim();
            const paypal = document.getElementById('pay-paypal').value.trim();

            if (iban || revolut || paypal) {
                text += `\n💳 *${dict.paymentDetails}:*\n`;
                if (iban) text += `IBAN: ${iban}\n`;
                if (revolut) text += `Revolut: ${revolut}\n`;
                if (paypal) text += `PayPal: ${paypal}\n`;
            }

            text += `\nCalculated with Split & Snap ⚡`;
            return text;
        }

        // 13. ACTIONS: SHARE, COPY, SAVE
        async function actionShare() {
            if (!document.getElementById('privacy-check').checked) return;

            const text = generateShareString();
            const dict = I18N[currentLang] || I18N.en;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: dict.shareTitle,
                        text: text
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') actionCopy();
                }
            } else {
                actionCopy();
            }
        }

        function actionCopy() {
            if (!document.getElementById('privacy-check').checked) return;

            const text = generateShareString();
            const dict = I18N[currentLang] || I18N.en;

            // ExecCommand fallback for strict iFrame restrictions
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast(dict.copiedSuccess);
            } catch (err) {
                showToast('Copy failed', true);
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function actionSaveHistory() {
            if (!document.getElementById('privacy-check').checked) return;

            const dict = I18N[currentLang] || I18N.en;
            const grand = document.getElementById('sum-grand').textContent;
            const perPerson = document.getElementById('sum-per-person').textContent;

            const record = {
                id: Date.now(),
                date: new Date().toLocaleDateString(currentLang, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                mode: currentMode,
                total: grand,
                perPerson: perPerson
            };

            const history = getHistory();
            history.unshift(record);
            localStorage.setItem('snapsplit_history', JSON.stringify(history.slice(0, 15))); // Keep max 15
            renderHistory();
            showToast(dict.savedSuccess);
        }

        // 14. HISTORY LOG RENDERING
        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem('snapsplit_history')) || [];
            } catch(e) {
                return [];
            }
        }

        function renderHistory() {
            const dict = I18N[currentLang] || I18N.en;
            const history = getHistory();
            const container = document.getElementById('history-list');
            container.innerHTML = '';

            if (history.length === 0) {
                container.innerHTML = `<p class="no-hist-msg text-xs text-slate-400 dark:text-slate-500 text-center py-3">${dict.noHistory}</p>`;
                return;
            }

            history.forEach(item => {
                const el = document.createElement('div');
                el.className = "flex justify-between items-center p-3 bg-white dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/50 rounded-2xl text-xs";
                el.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 dark:text-slate-200">${item.total} <span class="font-normal text-slate-400">(${item.perPerson} / person)</span></div>
                        <div class="text-[10px] text-slate-400">${item.date} &bull; ${item.mode.toUpperCase()}</div>
                    </div>
                    <button onclick="deleteHistoryItem(${item.id})" class="text-slate-400 hover:text-rose-500 transition">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                container.appendChild(el);
            });
        }

        function deleteHistoryItem(id) {
            let history = getHistory().filter(i => i.id !== id);
            localStorage.setItem('snapsplit_history', JSON.stringify(history));
            renderHistory();
        }

        function clearHistory() {
            const dict = I18N[currentLang] || I18N.en;
            localStorage.removeItem('snapsplit_history');
            renderHistory();
            showToast(dict.historyCleared);
        }

        // 15. TOAST NOTIFICATION SYSTEM
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            msgEl.textContent = message;
            if (isError) {
                iconEl.className = "fas fa-exclamation-circle text-rose-500";
            } else {
                iconEl.className = "fas fa-check-circle text-emerald-400 dark:text-emerald-600";
            }

            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 16. UTILITY FUNCTIONS
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 17. SERVICE WORKER INLINE REGISTRATION FOR OFFINE & PWA BUILDER
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'snapsplit-v1';
                    self.addEventListener('install', (e) => {
                        e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const blobUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(blobUrl).catch(() => {});
            }
        }
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW Registered!', reg))
        .catch(err => console.error('SW Registration Failed!', err));
    });
  }
</script>
